<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- background -->
    <rect width="1024" height="1024" fill="#141210"/>

    <!-- orange badge -->
    <rect x="304" y="304" width="416" height="416" rx="92" ry="92" fill="#FF8A3D"/>

    <!-- archive / box glyph, centered in badge -->
    <g transform="translate(426,424) scale(7.2)" fill="none" stroke="#FBF6EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="5" rx="1.2"/>
      <path d="M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
      <path d="M10 13h4"/>
    </g>

    <!-- inner hairline for panel depth -->
    <rect x="6" y="6" width="1012" height="1012" rx="222" ry="222"
          fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="3"/>
  </g>
</svg>
